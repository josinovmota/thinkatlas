[project]
name = "thinkatlas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ruff>=0.16.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

# Enables to import a library in the middle of a jupyter notebook
[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]